[project]
name = "colombia-que-piensa"
version = "0.2.0"
description = "Simulador de opinión pública colombiana sobre microdatos del DANE"
# 3.12 y no 3.14: pyreadstat, que lee los .sav del DANE, no trae ruedas para 3.14
requires-python = ">=3.12,<3.14"
dependencies = [
    "pandas>=2.2",
    "pyreadstat>=1.2",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
]

[tool.uv]
package = false
